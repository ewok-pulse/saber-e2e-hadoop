name: Endor Labs Scan
on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      java-hadoop-yarn-project: ${{ steps.filter.outputs.java-hadoop-yarn-project }}
      java-hadoop-tools: ${{ steps.filter.outputs.java-hadoop-tools }}
      java-hadoop-mapreduce-project: ${{ steps.filter.outputs.java-hadoop-mapreduce-project }}
      java-hadoop-common-project: ${{ steps.filter.outputs.java-hadoop-common-project }}
      java-hadoop-client-modules: ${{ steps.filter.outputs.java-hadoop-client-modules }}
      java-hadoop-cloud-storage-project: ${{ steps.filter.outputs.java-hadoop-cloud-storage-project }}
      java-hadoop-hdfs-project: ${{ steps.filter.outputs.java-hadoop-hdfs-project }}
      java-other: ${{ steps.filter.outputs.java-other }}
      javascript-typescript: ${{ steps.filter.outputs.javascript-typescript }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |-
            java-hadoop-yarn-project:
              - hadoop-yarn-project/**/'**/pom.xml'
              - hadoop-yarn-project/**/'**/build.gradle'
              - hadoop-yarn-project/**/'**/build.gradle.kts'
              - hadoop-yarn-project/**/'**/*.java'
            java-hadoop-tools:
              - hadoop-tools/**/'**/pom.xml'
              - hadoop-tools/**/'**/build.gradle'
              - hadoop-tools/**/'**/build.gradle.kts'
              - hadoop-tools/**/'**/*.java'
            java-hadoop-mapreduce-project:
              - hadoop-mapreduce-project/**/'**/pom.xml'
              - hadoop-mapreduce-project/**/'**/build.gradle'
              - hadoop-mapreduce-project/**/'**/build.gradle.kts'
              - hadoop-mapreduce-project/**/'**/*.java'
            java-hadoop-common-project:
              - hadoop-common-project/**/'**/pom.xml'
              - hadoop-common-project/**/'**/build.gradle'
              - hadoop-common-project/**/'**/build.gradle.kts'
              - hadoop-common-project/**/'**/*.java'
            java-hadoop-client-modules:
